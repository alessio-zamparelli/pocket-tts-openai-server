[project]
name = "pocket-tts-openai"
version = "0.1.0"
description = "OpenAI-compatible TTS server (POST /v1/audio/speech) powered by Kyutai's pocket-tts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pocket-tts-openai" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Actual TTS engine. On Linux prefer the CPU-only torch build to avoid ~3 GB of
# CUDA wheels:  uv sync --extra engine --index https://download.pytorch.org/whl/cpu
engine = ["pocket-tts>=0.1", "torch>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
pocket-tts-openai = "pocket_tts_openai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_tts_openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
